<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .memory-count {
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .memory-badge {
            background: #2d2d2d;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 75%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message.system {
            align-self: center;
            max-width: 60%;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .message.system .avatar {
            background: #2d2d2d;
            color: #888;
            width: 32px;
            height: 32px;
            font-size: 12px;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }

        .message.user .bubble {
            background: #2d2d2d;
            color: #e0e0e0;
            border-bottom-right-radius: 6px;
        }

        .message.ai .bubble {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            border-bottom-left-radius: 6px;
        }

        .message.system .bubble {
            background: transparent;
            color: #666;
            font-size: 13px;
            text-align: center;
            padding: 8px 12px;
        }

        .bubble .image-preview {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .bubble .image-preview:hover {
            transform: scale(1.02);
        }

        .memory-context {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .typing-indicator {
            display: none;
            padding: 14px 18px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
        }

        .typing-indicator.active {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.7;
            }

            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .input-container {
            padding: 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-end;
        }

        .input-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #imagePreview {
            position: relative;
            display: none;
            padding: 8px;
            background: #0f0f0f;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        #imagePreview img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 8px;
        }

        #removeImage {
            position: absolute;
            top: 0;
            right: 0;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        #removeImage:hover {
            background: #dc2626;
        }

        textarea {
            width: 100%;
            padding: 14px 18px;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 54px;
            max-height: 180px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea::placeholder {
            color: #666;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
        }

        #imageUpload {
            display: none;
        }

        #imageButton {
            background: #2d2d2d;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            padding: 0;
        }

        #imageButton:hover {
            background: #3d3d3d;
            transform: translateY(-2px);
        }

        #sendButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 90px;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            background: #2d2d2d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .error-message {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px 20px;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }

            .header {
                padding: 12px 16px;
            }

            .chat-container {
                padding: 16px 12px;
            }

            .input-container {
                padding: 12px;
            }

            button {
                padding: 12px 18px;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>
            <span class="status-indicator"></span>
            AI Vision Agent
        </h1>
        <div class="memory-count">
            <span>Memories:</span>
            <span class="memory-badge" id="memoryCount">0</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="avatar">AI</div>
            <div class="bubble">
                Hello! I'm your AI assistant with long-term memory. I can understand images and remember our
                conversations. How can I help you today?
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <div class="input-area">
                <div id="imagePreview">
                    <img id="previewImg" src="" alt="Preview">
                    <button id="removeImage">×</button>
                </div>
                <textarea id="messageInput" placeholder="Type a message or upload an image..." rows="1"></textarea>
            </div>
            <input type="file" id="imageUpload" accept="image/*">
            <button id="imageButton" title="Upload image">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>
            <button id="searchButton" title="Web Search">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const searchButton = document.getElementById('searchButton');
        const imageButton = document.getElementById('imageButton');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removeImage = document.getElementById('removeImage');
        const memoryCount = document.getElementById('memoryCount');

        let selectedImage = null;
        let selectedImageFile = null;

        let sessionId = localStorage.getItem('chat_session_id');
        if (!sessionId) {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_session_id', sessionId);
        }

        messageInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 180) + 'px';
        });

        imageButton.addEventListener('click', () => imageUpload.click());

        imageUpload.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                selectedImageFile = file;
                const reader = new FileReader();
                reader.onload = function (e) {
                    selectedImage = e.target.result;
                    previewImg.src = selectedImage;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        removeImage.addEventListener('click', () => {
            selectedImage = null;
            selectedImageFile = null;
            imagePreview.style.display = 'none';
            imageUpload.value = '';
        });

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            chatContainer.appendChild(errorDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => errorDiv.remove(), 5000);
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
        <div class="avatar">AI</div>
        <div class="typing-indicator active">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function callAgent(text, imageFile) {
            const formData = new FormData();
            formData.append("message", text);
            formData.append("session_id", sessionId);

            if (imageFile) {
                formData.append("image", imageFile);
            }

            const res = await fetch("http://localhost:8000/chat", {
                method: "POST",
                body: formData
            });

            if (!res.ok) {
                throw new Error(`Server error: ${res.status}`);
            }

            const data = await res.json();
            return data;
        }

        async function performWebSearch(query) {
            const formData = new FormData();
            formData.append("query", query);

            const res = await fetch("http://localhost:8000/web-search", {
                method: "POST",
                body: formData
            });

            if (!res.ok) {
                throw new Error(`Search server error: ${res.status}`);
            }

            const data = await res.json();
            return data;
        }

        async function updateMemoryCount() {
            try {
                const res = await fetch("http://localhost:8000/memory-count");
                const data = await res.json();
                memoryCount.textContent = data.count || 0;
            } catch (error) {
                console.error('Failed to update memory count:', error);
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`http://localhost:8000/session/${sessionId}/history`);
                const data = await res.json();

                const messages = chatContainer.querySelectorAll('.message');
                messages.forEach((msg, idx) => {
                    if (idx > 0) msg.remove();
                });

                data.history.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'ai'}`;
                    msgDiv.innerHTML = `
                <div class="avatar">${msg.role === 'user' ? 'You' : 'AI'}</div>
                <div class="bubble">
                    ${msg.image_url ? `<img src="${msg.image_url}" class="image-preview" alt="Uploaded image">` : ''}
                    ${msg.content}
                </div>
            `;
                    chatContainer.appendChild(msgDiv);
                });

                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedImage) return;

            const imgToSend = selectedImageFile;
            const imgPreview = selectedImage;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
        <div class="avatar">You</div>
        <div class="bubble">
            ${imgPreview ? `<img src="${imgPreview}" class="image-preview" alt="Uploaded image">` : ''}
            ${text ? `<div>${text}</div>` : ''}
        </div>
    `;
            chatContainer.appendChild(userMsg);

            messageInput.value = '';
            messageInput.style.height = 'auto';
            selectedImage = null;
            selectedImageFile = null;
            imagePreview.style.display = 'none';
            imageUpload.value = '';

            chatContainer.scrollTop = chatContainer.scrollHeight;
            sendButton.disabled = true;

            addTypingIndicator();

            try {
                const result = await callAgent(text, imgToSend);

                removeTypingIndicator();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';

                let memoryContextHTML = '';
                if (result.memories_used && result.memories_used.length > 0) {
                    memoryContextHTML = `
                <div class="memory-context">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                    Used ${result.memories_used.length} memory(s)
                </div>
            `;
                }

                aiMsg.innerHTML = `
            <div class="avatar">AI</div>
            <div class="bubble">
                ${result.response}
                ${memoryContextHTML}
            </div>
        `;
                chatContainer.appendChild(aiMsg);

                if (result.memory_stored) {
                    const systemMsg = document.createElement('div');
                    systemMsg.className = 'message system';
                    systemMsg.innerHTML = `
                <div class="avatar">📝</div>
                <div class="bubble">Memory saved: ${result.memory_stored}</div>
            `;
                    chatContainer.appendChild(systemMsg);
                }

                await updateMemoryCount();

            } catch (error) {
                removeTypingIndicator();
                showError(`Error: ${error.message}. Make sure the server is running.`);
                console.error('Chat error:', error);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
            sendButton.disabled = false;
            messageInput.focus();
        }

        async function displaySearchResults(query, results) {
            // Create user message showing the search query
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `
        <div class="avatar">You</div>
        <div class="bubble">
            <strong>Web Search:</strong> ${query}
        </div>
    `;
            chatContainer.appendChild(userMsg);

            if (results.error) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai';
                errorMsg.innerHTML = `
            <div class="avatar">AI</div>
            <div class="bubble">Sorry, I encountered an error while searching: ${results.error}</div>
        `;
                chatContainer.appendChild(errorMsg);
            } else if (results.results.length === 0) {
                const noResultsMsg = document.createElement('div');
                noResultsMsg.className = 'message ai';
                noResultsMsg.innerHTML = `
            <div class="avatar">AI</div>
            <div class="bubble">I couldn't find any results for your search query: ${query}</div>
        `;
                chatContainer.appendChild(noResultsMsg);
            } else {
                // Create AI message with search results
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                
                let resultsHtml = `<div class="avatar">AI</div><div class="bubble"><strong>Search Results for "${query}":</strong><br><br>`;
                
                results.results.slice(0, 5).forEach((result, index) => {  // Show top 5 results
                    resultsHtml += `<div style="margin-bottom: 15px; padding: 10px; border-left: 3px solid #4ade80; background: #1a1a1a; border-radius: 0 8px 8px 0;">`;
                    resultsHtml += `<strong><a href="${result.url}" target="_blank" style="color: #4ade80; text-decoration: none;">${result.title}</a></strong><br>`;
                    resultsHtml += `<small style="color: #aaa;">${result.url}</small><br>`;
                    resultsHtml += `<div style="margin-top: 5px; color: #ccc;">${result.snippet}</div>`;
                    resultsHtml += `</div>`;
                });
                
                resultsHtml += `</div>`;
                aiMsg.innerHTML = resultsHtml;
                chatContainer.appendChild(aiMsg);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function initiateSearch() {
            const query = messageInput.value.trim();
            if (!query) {
                showError('Please enter a search query');
                return;
            }

            try {
                addTypingIndicator();
                const results = await performWebSearch(query);
                removeTypingIndicator();
                await displaySearchResults(query, results);
                messageInput.value = '';
                messageInput.style.height = 'auto';
            } catch (error) {
                removeTypingIndicator();
                showError(`Search error: ${error.message}`);
                console.error('Search error:', error);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        searchButton.addEventListener('click', initiateSearch);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                // Check if Ctrl/Cmd is pressed to trigger search instead of send
                if (e.ctrlKey || e.metaKey) {
                    initiateSearch();
                } else {
                    sendMessage();
                }
            }
        });

        updateMemoryCount();
        loadHistory();

    </script>
</body>

</html>
